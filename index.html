<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craft</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="underwater" hidden></div>
    <div id="crosshair"></div>
    <div id="block-name"></div>
    <div id="hotbar"></div>
    <div id="play">
      <div>
        <h1>Craft</h1>
        <p>A voxel world drawn with Projector on a 2D canvas</p>
        <ul class="keys">
          <li><b>WASD</b> move</li>
          <li><b>Space</b> jump, swim up</li>
          <li><b>Shift</b> sprint</li>
          <li><b>Left click</b> break</li>
          <li><b>Right click</b> place</li>
          <li><b>1–9, wheel</b> pick a block</li>
        </ul>
        <p class="start">Click to play</p>
        <p class="muted">Esc releases the mouse</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
